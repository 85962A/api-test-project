name: API 自动化测试

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # 支持在 GitHub 网页上手动点 "Run workflow"

jobs:
  pytest:
    name: pytest（接口自动化用例）
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 准备报告目录
        run: mkdir -p reports

      - name: 运行接口自动化测试（输出 JUnit 报告）
        run: pytest -v --junitxml=reports/junit.xml

      - name: 校验用例数量（防止 0 用例/少用例也判通过）
        if: always()
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('reports/junit.xml').getroot()
          suite = root if root.tag == 'testsuite' else root.find('testsuite')
          tests = int(suite.get('tests', 0))
          failures = int(suite.get('failures', 0))
          errors = int(suite.get('errors', 0))
          print('collected=%d failures=%d errors=%d' % (tests, failures, errors))
          if tests < 21:
              raise SystemExit('用例数异常：只收集到 %d 条（预期 21 条）' % tests)
          PY

      - name: 生成测试摘要（读 SQLite，按类别统计 PASS/FAIL）
        if: always()
        run: |
          python report.py > reports/summary.txt 2>&1 || echo "(report.py 未生成摘要，pytest 可能未写入结果)" >> reports/summary.txt
          cat reports/summary.txt

      - name: 写入 Actions 摘要页（便于截图留证）
        if: always()
        run: |
          {
            echo "## 📊 API 自动化测试摘要"
            echo ""
            echo '```'
            cat reports/summary.txt 2>/dev/null || echo "(未生成)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传测试报告（工件，保留 14 天）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            reports/junit.xml
            reports/summary.txt
            test_results.db
          retention-days: 14
